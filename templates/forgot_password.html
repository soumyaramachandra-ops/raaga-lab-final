{% extends "base.html" %}

{% block title %}Forgot Password - RAAGA LAB{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="auth-box">
        <div class="analysis-header">
            <span class="eyebrow">Account recovery</span>
            <h1>Reset <span class="gradient-text">password</span></h1>
            <p>Enter your email address to request recovery support.</p>
        </div>

        <form method="POST" class="stacked-form">
            <input type="email" name="email" placeholder="Email Address" required>
            <button class="primary-btn" type="submit">Send Reset Link</button>
        </form>

        <div class="form-link"><a href="/login">Back To Login</a></div>
    </div>
</section>
{% endblock %}
